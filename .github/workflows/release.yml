name: Release

on:
  push:
    branches:
      - dev
    tags:
      - "v*"
      - "!v*-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      make_latest: ${{ steps.release.outputs.make_latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Test release metadata
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Resolve version and release notes
        id: release
        run: python3 .github/scripts/release_metadata.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          if-no-files-found: error
          overwrite: true

  test:
    name: Test (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Test Ubuntu
        if: runner.os == 'Linux'
        run: go test ./...
      - name: Vet Ubuntu
        if: runner.os == 'Linux'
        run: go vet ./...
      - name: Test Windows updater
        if: runner.os == 'Windows'
        run: go test ./lib -run '^(TestShouldOfferUpdate|TestSelectReleaseAsset|TestUpdate|TestCopyWithProgress|TestInstallRelease|TestReplace|TestStage|TestWindows)' -count=1 -timeout=3m
      - name: Test Windows update UI
        if: runner.os == 'Windows'
        run: go test ./core -run '^TestUpdate' -count=1 -timeout=3m
      - name: Vet Windows updater
        if: runner.os == 'Windows'
        run: go vet ./lib ./core ./cmd

  build-and-release:
    name: Build Archives
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          binary_name=readcli${{ matrix.ext }}
          go build -o "dist/${binary_name}" -ldflags "-s -w -X main.Version=${VERSION}" ./cmd
          if [ "$GOOS" = "windows" ]; then
            zip -j "dist/readcli-${GOOS}-${GOARCH}-${VERSION}.zip" "dist/${binary_name}"
          else
            tar czf "dist/readcli-${GOOS}-${GOARCH}-${VERSION}.tar.gz" -C dist "${binary_name}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: readcli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/readcli-${{ matrix.goos }}-${{ matrix.goarch }}-${{ needs.prepare.outputs.version }}.*
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [prepare, build-and-release]
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: readcli-*
          path: release
          merge-multiple: true
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: notes
      - name: Generate checksums
        working-directory: release
        run: sha256sum *.tar.gz *.zip > sha256sum.txt
      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}
          body_path: notes/release_notes.md
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/*.zip
            release/sha256sum.txt
